<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="280" viewBox="0 0 1200 280" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc" style="display:block;background:#ffffff;">
  <title id="title">Kawasaki Rideology BLE</title>
  <desc id="desc">Styled text banner for the project README.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff0000" />
      <stop offset="100%" stop-color="#ff0000" />
    </linearGradient>
    <linearGradient id="subtitleGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="00%" stop-color="#000000" />
      <stop offset="100%" stop-color="#1b1b1b" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0" />
    </filter>
    <filter id="subtitle" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="0" flood-color="#000000" flood-opacity="0" />
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="280" rx="0" fill="url(#bg)" />

  <g filter="url(#softShadow)">
    <text
      x="50%"
      y="42%"
      transform="translate(600 117.6) scale(1 0.8) translate(-600 -117.6)"
      text-anchor="middle"
      dominant-baseline="middle"
      fill="url(#textGradient)"
      font-family="'Helvetica', 'Segoe UI', Arial, sans-serif"
      font-size="118"
      font-weight="1000"
      letter-spacing="0.5">
      Kawasaki
    </text>
  </g>
  <g filter="url(#subtitle)">
    <text
      x="50%"
      y="70%"
      transform="translate(600 196) scale(1 1) translate(-600 -196)"
      text-anchor="middle"
      dominant-baseline="middle"
      fill="url(#subtitleGradient)"
      font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif"
      font-size="74"
      font-weight="700"
      letter-spacing="1.2">
      Rideology BLE
    </text>
  </g>
</svg>
